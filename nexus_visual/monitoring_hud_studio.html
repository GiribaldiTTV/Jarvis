<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus Desktop AI Studio</title>
  <link rel="stylesheet" href="monitoring_hud.css" />
  <link rel="stylesheet" href="nexus_window_primitives.css" />
  <style>
    body.desktop-mode #monitoring-hud[data-product-surface="fam006-feature-studio"] {
      width: 100%;
      height: 100%;
      min-height: 100%;
    }

    body.desktop-mode #monitoring-hud[data-product-surface="fam006-feature-studio"] .monitoring-hud__chrome {
      min-height: 100%;
      box-sizing: border-box;
      padding: 12px 16px 14px;
      overflow: hidden;
    }

    body.desktop-mode #monitoring-hud[data-product-surface="fam006-feature-studio"] .monitoring-hud__header {
      padding-right: 0;
    }

    body.desktop-mode #monitoring-hud[data-product-surface="fam006-feature-studio"] .monitoring-hud__control-hub {
      margin-top: 4px;
      gap: 0;
      padding: 0;
      scroll-padding: 0;
      scrollbar-gutter: auto;
      scrollbar-width: none;
      scrollbar-color: transparent transparent;
    }

    body.desktop-mode #monitoring-hud[data-product-surface="fam006-feature-studio"] .monitoring-hud__hub-actions {
      margin-top: 0;
    }
  </style>
</head>
<body class="desktop-mode">
  <section
    id="monitoring-hud"
    class="monitoring-hud"
    data-package="PKG-006"
    data-slice="SLC-053"
    data-surface-id="fam006-recording-studio"
    data-product-surface-role="standalone-feature-studio"
    data-product-surface="fam006-feature-studio"
    data-studio-surface="recording"
    data-feature-studio-purpose="ultra-lightweight-detached-recording-controller"
    data-frame-ownership="fam006-compact-feature-studio-chrome"
    data-shared-primitive-consumer="nexus-window-primitives-v1"
    data-feature-studio-primitive="fam006-unique-child-studio-shell-v5"
    data-window-taxonomy="unique-child-standalone-feature-studio"
    data-window-resize-taxonomy="no-resize-recording-edge-resize-log-viewer"
    data-edge-resize-behavior="edge-resize-native-top-level"
    data-attached-child-resize-grip="absent"
    data-window-control-primitive="nexus-uiref-002-compact-cluster-v1"
    data-window-control-cluster="compact-minimize-close"
    data-window-control-state-model="hidden-blocked-active"
    data-resize-contract="not-resizable-position-memory-only"
    data-fixed-controller-height="260"
    data-title-treatment="detached-child-window-header-no-title-card"
    data-title-card-state="absent"
    data-child-window-title-grammar="category-line-plus-strong-title"
    aria-label="Nexus Desktop AI Recording Studio"
  >
    <div class="monitoring-hud__chrome" aria-label="Visible Nexus Desktop AI Studio panel">
      <div class="monitoring-hud__window-controls" role="group" aria-label="Studio window controls">
        <button type="button" id="monitoring-hud-studio-minimize-action" class="monitoring-hud__window-control-button monitoring-hud__window-control-button--minimize" data-control="minimize-studio" data-window-control-key="minimize" data-window-control-command="minimize" data-window-control-state="active" aria-label="Minimize Studio"></button>
        <button type="button" id="monitoring-hud-studio-close-action" class="monitoring-hud__window-control-button monitoring-hud__window-control-button--close" data-control="close-studio" data-window-control-key="close" data-window-control-command="close" data-window-control-state="active" aria-label="Close Studio"></button>
      </div>
      <div class="monitoring-hud__title-group monitoring-hud__child-window-header monitoring-hud__detached-child-studio-header">
        <div class="monitoring-hud__header" id="monitoring-hud-studio-drag-handle">
          <div>
            <div class="monitoring-hud__kicker" id="monitoring-hud-studio-kicker">Nexus Desktop AI</div>
            <div class="monitoring-hud__title" id="monitoring-hud-studio-title">Recording Studio</div>
            <div class="monitoring-hud__subtitle" id="monitoring-hud-studio-subtitle" aria-hidden="true">Start/Stop, target truth, and log handoff.</div>
          </div>
        </div>
      </div>
      <div class="monitoring-hud__control-hub" data-feature-studio-content="purpose-built-studio-shell" data-feature-studio-body-primitive="unique-child-purpose-stack-v5" aria-label="Studio controls">
        <article id="monitoring-hud-studio-recording-card" class="monitoring-hud__feature-studio-panel" data-feature-studio-panel="recording-controller">
          <div class="monitoring-hud__controller-stack" data-controller-primitive="ultra-light-recording-controller">
            <div class="monitoring-hud__controller-target" data-element-group="recording-target-truth">
              <span>Target</span>
              <strong id="monitoring-hud-studio-recording-target">No active overlay profile</strong>
            </div>
            <div class="monitoring-hud__controller-status" data-element-group="recording-status-truth">
              <span>Status</span>
              <span id="monitoring-hud-studio-recording-status">Ready for local recording.</span>
            </div>
          </div>
          <div class="monitoring-hud__feature-studio-actions" data-button-layout="content-fit">
            <button type="button" id="monitoring-hud-studio-recording-toggle-action" class="monitoring-hud__hub-action monitoring-hud__hub-action--compact monitoring-hud__hub-action--content-fit" data-control="recording-studio-toggle" data-recording-command="start" data-action-button-primitive="monitoring-hud-hub-action-content-fit-equal-gutter-v2" data-action-button-visual-shape="hub-action-content-fit-equal-gutter-32px-pill"><span class="monitoring-hud__button-label">Start Recording</span></button>
            <button type="button" id="monitoring-hud-studio-open-log-viewer-action" class="monitoring-hud__hub-action monitoring-hud__hub-action--compact monitoring-hud__hub-action--content-fit" data-control="recording-studio-open-log-viewer" data-action-button-primitive="monitoring-hud-hub-action-content-fit-equal-gutter-v2" data-action-button-visual-shape="hub-action-content-fit-equal-gutter-32px-pill"><span class="monitoring-hud__button-label">Log Viewer Studio</span></button>
          </div>
        </article>
        <article id="monitoring-hud-studio-log-card" class="monitoring-hud__feature-studio-panel" data-feature-studio-panel="log-access-shell" hidden>
          <div class="monitoring-hud__log-access-stack" data-log-shell-primitive="compact-folder-access-shell">
            <div class="monitoring-hud__log-access-item" data-element-group="native-log-folder-access">
              <span>Native Logs</span>
              <strong id="monitoring-hud-studio-native-folder"></strong>
            </div>
            <div class="monitoring-hud__log-access-item" data-element-group="exported-log-folder-access">
              <span>Exported Logs</span>
              <strong id="monitoring-hud-studio-export-folder"></strong>
            </div>
            <div class="monitoring-hud__log-access-status" data-element-group="log-folder-action-status">
              <span>Status</span>
              <strong id="monitoring-hud-studio-folder-status">Native and exported log folders are ready to open.</strong>
            </div>
          </div>
          <div class="monitoring-hud__feature-studio-actions" data-button-layout="content-fit">
            <button type="button" id="monitoring-hud-studio-open-native-action" class="monitoring-hud__hub-action monitoring-hud__hub-action--compact monitoring-hud__hub-action--content-fit" data-control="log-viewer-open-native" data-action-button-primitive="monitoring-hud-hub-action-content-fit-equal-gutter-v2" data-action-button-visual-shape="hub-action-content-fit-equal-gutter-32px-pill"><span class="monitoring-hud__button-label">Open Native Logs</span></button>
            <button type="button" id="monitoring-hud-studio-open-export-action" class="monitoring-hud__hub-action monitoring-hud__hub-action--compact monitoring-hud__hub-action--content-fit" data-control="log-viewer-open-export" data-action-button-primitive="monitoring-hud-hub-action-content-fit-equal-gutter-v2" data-action-button-visual-shape="hub-action-content-fit-equal-gutter-32px-pill"><span class="monitoring-hud__button-label">Open Exported Logs</span></button>
          </div>
        </article>
      </div>
    </div>
  </section>
  <script src="monitoring_hud_studio.js"></script>
</body>
</html>
